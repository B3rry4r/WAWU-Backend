name: Protected routes (V3)

# MONEY-01. Nothing the live web app or the admin dashboard uses may change
# behaviour while this backend grows.
#
# The suite also runs inside deploy.yml's `npx jest` step, but there it is the
# branch's own copy of the suite and the lock, which a branch can edit. This
# job holds a pull request to the BASE branch's checker:
#
#   - The base branch is checked out (into ./base). The pull request's head
#     commit is only fetched into it as an object; nothing of the pull
#     request's is executed except the code under test.
#   - scripts/protected-routes/ci-check.sh, run.sh, lock-diff.py and the suite
#     (src/ and test/protected-routes, the registry) all come from the base.
#     run.sh also writes its own jest config and checks that every locked entry
#     ran, so the pull request's package.json cannot exclude the suite.
#   - A pull request that changes the lock or any checker file is checked
#     against the base's lock (and fails if its code no longer matches it)
#     unless the owner applied the `relock-approved` label AFTER its latest
#     push: only the run triggered by that `labeled` event counts it, and any
#     later push is a `synchronize` run that does not. The lock diff is in the
#     job summary either way.
#   - The pull request that introduces the suite is checked against its own
#     (the base has none yet).
#
# On `pull_request` GitHub runs the workflow FILE from the pull request, so
# this file is protected by CODEOWNERS and by making the job a required check
# (README, "Protected route suite": repository settings, not code).
# deploy.yml is untouched: this runs on pull requests only.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protected-routes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v3:
    name: Protected route suite against the base branch's checker and lock
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wawu_hub_protected_test?schema=public
      WAWU_ID_BASE_URL: http://localhost:4001
      WAWU_ID_JWKS_URL: http://localhost:4001/.well-known/jwks.json
      ADMIN_JWT_SECRET: ci-only-admin-secret-not-a-real-one-000000
      ADMIN_JWT_REFRESH_SECRET: ci-only-admin-refresh-secret-not-a-real-one-0
      # 1 only on the run the owner's label itself triggered (see above).
      RELOCK_APPROVED: ${{ (github.event.action == 'labeled' && github.event.label.name == 'relock-approved') && '1' || '0' }}

    steps:
      - name: Check out the BASE branch (the checker)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: base
          fetch-depth: 0

      - name: Fetch the pull request's head commit (the code under test)
        id: shas
        working-directory: base
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            git fetch --no-tags origin \
              "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/pr/head"
            PR_SHA="$(git rev-parse refs/remotes/pr/head)"
            test "$PR_SHA" = "${{ github.event.pull_request.head.sha }}"
          else
            PR_SHA="$(git rev-parse HEAD)"
          fi
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "pr=$PR_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: base/package-lock.json

      - name: Install the base's dependencies
        working-directory: base
        run: npm ci --no-audit --no-fund

      - name: Start mock WAWU ID (the base's)
        working-directory: base/mock-wawu-id
        run: |
          npm ci --no-audit --no-fund
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out private.pem -quiet
          openssl rsa -in private.pem -pubout -out public.pem 2>/dev/null
          nohup node server.js > /tmp/mock.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4001/health >/dev/null && echo "mock up" && exit 0
            sleep 1
          done
          cat /tmp/mock.log >&2
          exit 1

      - name: Run the suite (base's checker, pull request's code)
        working-directory: base
        run: |
          BASE_SHA='${{ steps.shas.outputs.base }}'
          PR_SHA='${{ steps.shas.outputs.pr }}'
          if git cat-file -e "$BASE_SHA:scripts/protected-routes/ci-check.sh" 2>/dev/null; then
            git show "$BASE_SHA:scripts/protected-routes/ci-check.sh" > .protected-ci-check.sh
          else
            # Only the pull request that introduces the suite gets here.
            git show "$PR_SHA:scripts/protected-routes/ci-check.sh" > .protected-ci-check.sh
          fi
          bash .protected-ci-check.sh "$BASE_SHA" "$PR_SHA" "$RELOCK_APPROVED"

name: Deploy Hub API

# Auto-deploys main. A push that fails the test job never reaches the droplet.
on:
  push:
    branches: [main]
  # So a deploy can be re-run without an empty commit — the button you want
  # at 2am when the droplet was down during the last push.
  workflow_dispatch:

concurrency:
  # One deploy at a time. Two overlapping rsyncs into the same directory,
  # each followed by `prisma migrate deploy`, is how a half-written release
  # gets restarted.
  group: deploy-hub-api
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wawu_hub_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wawu_hub_test?schema=public
      WAWU_ID_JWKS_URL: http://localhost:4001/.well-known/jwks.json
      WAWU_ID_BASE_URL: http://localhost:4001
      ADMIN_JWT_SECRET: ci-only-admin-secret-not-a-real-one-000000
      ADMIN_JWT_REFRESH_SECRET: ci-only-admin-refresh-secret-not-a-real-one-0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Prisma generate + migrate
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Seed
        run: npm run db:seed

      - name: Start mock WAWU ID
        # The contract tests do a real JWKS handshake against this service, so
        # it has to be genuinely running and genuinely signing.
        run: |
          cd mock-wawu-id
          npm ci --no-audit --no-fund

          # THE SIGNING KEYPAIR IS NOT IN THE REPO, AND SHOULD NOT BE.
          # private.pem is gitignored — correctly, it is a private key even
          # for a mock — so a fresh checkout does not have it and the mock
          # dies on startup with ENOENT. Every contract test then fails with
          # "mock-wawu-id did not become healthy in time", which points at a
          # timeout rather than at the missing file.
          #
          # BOTH halves are regenerated, not just the private one: public.pem
          # IS committed, and a new private key with the old public key would
          # make the mock sign with one key while its JWKS advertises another
          # — every signature check would fail, which is a far more confusing
          # failure than the mock simply not starting.
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out private.pem -quiet
          openssl rsa -in private.pem -pubout -out public.pem 2>/dev/null

          nohup node server.js > /tmp/mock.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4001/health >/dev/null && echo "mock up" && exit 0
            sleep 1
          done
          echo "mock-wawu-id never became healthy. Its log:" >&2
          cat /tmp/mock.log >&2
          exit 1

      - run: npx tsc --noEmit

      - name: Contract tests
        run: npx jest --runInBand --forceExit

  deploy:
    name: Deploy to droplet
    needs: test
    runs-on: ubuntu-latest
    # Only main reaches the droplet, even if the workflow is dispatched
    # from a branch by mistake.
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Load SSH key
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinning the host key rather than StrictHostKeyChecking=no: without
          # it, CI would accept ANY host answering on that IP, which is the
          # whole point of the check.
          printf '%s\n' "${{ secrets.DROPLET_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Rsync source to droplet
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude 'dist-seed' \
            --exclude 'generated' \
            --exclude 'mock-wawu-id/node_modules' \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            ./ wawu@${{ secrets.DROPLET_HOST }}:/srv/wawu/hub-api/

      - name: Install, migrate, build, restart
        run: |
          ssh -i ~/.ssh/id_ed25519 wawu@${{ secrets.DROPLET_HOST }} \
            'bash /srv/wawu/hub-api/deploy/deploy.sh hub-api'

      - name: Smoke test the live service
        # A deploy that "succeeded" but serves 502 is not a deploy. This is the
        # check that turns the run red when the box is broken.
        run: |
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://${{ secrets.API_DOMAIN }}/api/hub/shop/products || true)
            echo "attempt $i: HTTP $code"
            # 200 = serving. 401 also proves the app is up and authenticating.
            if [ "$code" = "200" ] || [ "$code" = "401" ]; then exit 0; fi
            sleep 4
          done
          echo "Service did not answer after the deploy." >&2
          exit 1

  # ---------------------------------------------------------------------------
  # THE THING THAT WAS MISSING.
  #
  # Seven deploys failed in a row between 14 and 21 September and nobody
  # noticed. The droplet served week-old code the whole time: the two ticks,
  # Credits at 85/15, the admin finance API and the profile experience list
  # were all merged, all green on their own PRs, and none of them were in
  # production. It surfaced as "property company should not exist" on a save,
  # which reads like a frontend bug and is not one.
  #
  # A red badge on a page nobody opens is the same as no CI at all. So a
  # failure now opens an ISSUE and assigns it, which is the one GitHub event
  # that reliably reaches an inbox and a phone.
  #
  # ONE ISSUE, NOT ONE PER FAILURE. It is found by a fixed marker in the body
  # and updated with a comment when it is already open, because seven separate
  # issues are as easy to scroll past as seven red badges. It closes itself on
  # the next green deploy, so an open issue always means "production is behind
  # main right now" rather than "something went wrong once".
  #
  # NO NEW SECRETS. GITHUB_TOKEN is issued to the run automatically; the only
  # cost is the `issues: write` permission below.
  # ---------------------------------------------------------------------------
  notify:
    name: Report deploy status
    needs: [test, deploy]
    # `always()`, not `failure()`: this job has to run on a GREEN deploy too,
    # otherwise the issue it opened would never be closed. The branching is in
    # the step conditions, which read the results of the two jobs above.
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Open or update the deploy-failure issue
        # `deploy` is SKIPPED when `test` fails, so a skipped deploy is not
        # itself a failure and must not be treated as one. Checking both
        # results explicitly is what makes "test went red" and "the droplet
        # went red" both land here, and a cancelled run land nowhere.
        if: needs.test.result == 'failure' || needs.deploy.result == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- deploy-failure-tracker -->';
            const failed = [
              ['Test', '${{ needs.test.result }}'],
              ['Deploy to droplet', '${{ needs.deploy.result }}'],
            ].filter(([, r]) => r === 'failure').map(([n]) => n).join(' and ');

            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha.slice(0, 8);
            const line = `**${failed}** failed for \`${sha}\`. [Run log](${run})`;

            // Search this repo's OPEN issues for the marker. `listForRepo` is
            // used rather than the search API because search is eventually
            // consistent: two failures minutes apart could both miss an issue
            // that already exists and open a second one.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = open.find((i) => (i.body || '').includes(MARKER));

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing. ${line}`,
              });
              core.setFailed(`Deploy still failing — see issue #${existing.number}`);
              return;
            }

            const body = [
              MARKER,
              '',
              '## Production is behind `main`',
              '',
              line,
              '',
              'Until this is fixed the droplet keeps serving the last commit that',
              'deployed successfully, so anything merged after it is NOT live, however',
              'green its own pull request was.',
              '',
              'This issue updates itself while the failure persists and closes itself',
              'on the next green deploy. An open copy means production is behind right',
              'now.',
            ].join('\n');

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Deploy to production is failing',
              body,
              // Assigned, because assignment is what actually generates a
              // notification. An unassigned issue in a repo you own is just
              // another row nobody reads.
              assignees: [context.repo.owner],
            });
            core.setFailed(`Deploy failing — opened issue #${created.data.number}`);

      - name: Close the failure issue on a green deploy
        if: needs.test.result == 'success' && needs.deploy.result == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- deploy-failure-tracker -->';
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = open.find((i) => (i.body || '').includes(MARKER));
            if (!existing) return;

            const sha = context.sha.slice(0, 8);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: `Deploy is green again on \`${sha}\`. Production is up to date with \`main\`.`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              state: 'closed',
              state_reason: 'completed',
            });

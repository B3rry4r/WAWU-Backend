name: Deploy Hub API

# Auto-deploys main. A push that fails the test jobs never reaches the droplet.
#
# DEPLOY-FAST (24 Oct 2026). The tests used to run as ONE job (`npx jest
# --runInBand --forceExit`, about 50 minutes) after a merge, although every
# pull request had already passed the same suite in Branch checks, in 3
# parallel shards (about 20 minutes). Now:
#
#   decide  Can the tests be skipped? Only when the commit being deployed has a
#           tree byte-identical to a commit that already passed every Branch
#           checks job, the Gates and the Protected routes workflows, all on
#           that exact head_sha (scripts/ci/decide_skip_tests.py). Anything
#           else, or any doubt, runs the tests. The decision and the run ids it
#           relied on are in the job log and summary.
#   suite   The same 3 shards Branch checks runs (--runInBand inside each: the
#           suite is not parallel-safe). Skipped when decide says so.
#   netns   The same real-socket job Branch checks runs. Skipped with the suite.
#   deploy  Needs decide, all three shards and netns (or the skip). Migrate,
#           build, restart and the smoke test ALWAYS run: nothing skips them.
#
# suite and netns are COPIES of the same jobs in branch-checks.yml; a workflow
# cannot call another workflow's job. scripts/ci/check_deploy_in_sync.py (job
# deploy-test-in-sync in Branch checks) fails when the two differ.
on:
  push:
    branches: [main]
  # So a deploy can be re-run without an empty commit: the button you want
  # at 2am when the droplet was down during the last push.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Decide and run the tests, never deploy (proves the pipeline without touching the droplet)'
        type: boolean
        default: false
      force_tests:
        description: 'Run the tests even when the decision is to skip them'
        type: boolean
        default: false

concurrency:
  # One deploy at a time. Two overlapping rsyncs into the same directory,
  # each followed by `prisma migrate deploy`, is how a half-written release
  # gets restarted. A newer push replaces a PENDING older run (a running one
  # is never cancelled). A dry run never deploys, so it has a group of its own:
  # it must not take the place of a pending real deploy.
  group: ${{ inputs.dry_run && format('deploy-hub-api-dry-run-{0}', github.run_id) || 'deploy-hub-api' }}
  cancel-in-progress: false

jobs:
  decide:
    name: Decide whether the tests can be skipped
    runs-on: ubuntu-latest
    permissions:
      # contents: the checkout. actions: read the Branch checks, Gates and
      # Protected routes runs of the commit (the only API calls made).
      contents: read
      actions: read
    outputs:
      skip_tests: ${{ steps.decision.outputs.skip_tests }}
      reason: ${{ steps.decision.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A merge commit and both of its parents.
          fetch-depth: 2

      - name: The decision script's own tests
        run: python3 -m unittest scripts/ci/test_decide_skip_tests.py

      - name: Decision
        id: decision
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_TESTS: ${{ inputs.force_tests }}
        run: python3 scripts/ci/decide_skip_tests.py

  suite:
    name: Tests (shard ${{ matrix.shard }} of 3)
    needs: decide
    if: needs.decide.outputs.skip_tests != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wawu_hub_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wawu_hub_test?schema=public
      WAWU_ID_JWKS_URL: http://localhost:4001/.well-known/jwks.json
      WAWU_ID_BASE_URL: http://localhost:4001
      ADMIN_JWT_SECRET: ci-only-admin-secret-not-a-real-one-000000
      ADMIN_JWT_REFRESH_SECRET: ci-only-admin-refresh-secret-not-a-real-one-0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Prisma generate + migrate
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Seed
        run: npm run db:seed

      - name: Start mock WAWU ID
        # The contract tests do a real JWKS handshake against this service, so
        # it has to be genuinely running and genuinely signing.
        run: |
          cd mock-wawu-id
          npm ci --no-audit --no-fund

          # THE SIGNING KEYPAIR IS NOT IN THE REPO, AND SHOULD NOT BE.
          # private.pem is gitignored — correctly, it is a private key even
          # for a mock — so a fresh checkout does not have it and the mock
          # dies on startup with ENOENT. Every contract test then fails with
          # "mock-wawu-id did not become healthy in time", which points at a
          # timeout rather than at the missing file.
          #
          # BOTH halves are regenerated, not just the private one: public.pem
          # IS committed, and a new private key with the old public key would
          # make the mock sign with one key while its JWKS advertises another
          # — every signature check would fail, which is a far more confusing
          # failure than the mock simply not starting.
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out private.pem -quiet
          openssl rsa -in private.pem -pubout -out public.pem 2>/dev/null

          nohup node server.js > /tmp/mock.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4001/health >/dev/null && echo "mock up" && exit 0
            sleep 1
          done
          echo "mock-wawu-id never became healthy. Its log:" >&2
          cat /tmp/mock.log >&2
          exit 1

      - run: npx tsc --noEmit

      - name: Contract tests (shard ${{ matrix.shard }} of 3)
        run: npx jest --runInBand --forceExit --shard=${{ matrix.shard }}/3

  netns:
    name: Tests (netns)
    needs: decide
    if: needs.decide.outputs.skip_tests != 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wawu_hub_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wawu_hub_test?schema=public
      WAWU_ID_JWKS_URL: http://localhost:4001/.well-known/jwks.json
      WAWU_ID_BASE_URL: http://localhost:4001
      ADMIN_JWT_SECRET: ci-only-admin-secret-not-a-real-one-000000
      ADMIN_JWT_REFRESH_SECRET: ci-only-admin-refresh-secret-not-a-real-one-0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Prisma generate + migrate
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Seed
        run: npm run db:seed

      - name: Start mock WAWU ID
        # The contract tests do a real JWKS handshake against this service, so
        # it has to be genuinely running and genuinely signing.
        run: |
          cd mock-wawu-id
          npm ci --no-audit --no-fund

          # THE SIGNING KEYPAIR IS NOT IN THE REPO, AND SHOULD NOT BE.
          # private.pem is gitignored — correctly, it is a private key even
          # for a mock — so a fresh checkout does not have it and the mock
          # dies on startup with ENOENT. Every contract test then fails with
          # "mock-wawu-id did not become healthy in time", which points at a
          # timeout rather than at the missing file.
          #
          # BOTH halves are regenerated, not just the private one: public.pem
          # IS committed, and a new private key with the old public key would
          # make the mock sign with one key while its JWKS advertises another
          # — every signature check would fail, which is a far more confusing
          # failure than the mock simply not starting.
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out private.pem -quiet
          openssl rsa -in private.pem -pubout -out public.pem 2>/dev/null

          nohup node server.js > /tmp/mock.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4001/health >/dev/null && echo "mock up" && exit 0
            sleep 1
          done
          echo "mock-wawu-id never became healthy. Its log:" >&2
          cat /tmp/mock.log >&2
          exit 1

      - name: Route failures on real sockets (npm run test:netns, with sudo)
        # MONEY-18 round 4. The one proof that a route dying under an open
        # connection is never read as "the request was not sent" needs a
        # private network namespace and iptables, so it is a script and not a
        # jest test (a test that cannot get a namespace has to skip). The
        # runner has passwordless sudo. If a namespace cannot be made here the
        # script exits non-zero and this job fails: cannot run is a failure.
        run: sudo env "PATH=$PATH" npm run test:netns

  deploy:
    name: Deploy to droplet
    needs: [decide, suite, netns]
    runs-on: ubuntu-latest
    # Only main reaches the droplet, even if the workflow is dispatched
    # from a branch by mistake, and never on a dry run.
    #
    # `!cancelled()`: the tests are SKIPPED when decide says so, and a job
    # whose needs were skipped is skipped too unless it says otherwise. The
    # two ways in are spelt out: the tests were skipped by the decision (both
    # test jobs skipped, nothing else), or both test jobs passed. A failed test
    # job, or a decide that failed, is neither.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && inputs.dry_run != true &&
      needs.decide.result == 'success' &&
      ((needs.decide.outputs.skip_tests == 'true' && needs.suite.result == 'skipped' && needs.netns.result == 'skipped') ||
       (needs.suite.result == 'success' && needs.netns.result == 'success'))

    steps:
      - uses: actions/checkout@v4

      - name: Load SSH key
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinning the host key rather than StrictHostKeyChecking=no: without
          # it, CI would accept ANY host answering on that IP, which is the
          # whole point of the check.
          printf '%s\n' "${{ secrets.DROPLET_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Rsync source to droplet
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude 'dist-seed' \
            --exclude 'generated' \
            --exclude 'mock-wawu-id/node_modules' \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            ./ wawu@${{ secrets.DROPLET_HOST }}:/srv/wawu/hub-api/

      - name: Install, migrate, build, restart
        run: |
          ssh -i ~/.ssh/id_ed25519 wawu@${{ secrets.DROPLET_HOST }} \
            'bash /srv/wawu/hub-api/deploy/deploy.sh hub-api'

      - name: Smoke test the live service
        # A deploy that "succeeded" but serves 502 is not a deploy. This is the
        # check that turns the run red when the box is broken.
        #
        # It probes /api/hub/health (src/app.controller.ts): no guard, no
        # database read, and it stays. It used to probe /api/hub/shop/products,
        # which answers 410 since Shop was retired (R-2, OPS-08), so every deploy
        # after that would have failed here. Only 200 counts: health has no auth
        # to answer 401 with, so a 401 would mean something else answered.
        run: |
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://${{ secrets.API_DOMAIN }}/api/hub/health || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 4
          done
          echo "Service did not answer after the deploy." >&2
          exit 1

  # ---------------------------------------------------------------------------
  # THE THING THAT WAS MISSING.
  #
  # Seven deploys failed in a row between 14 and 21 September and nobody
  # noticed. The droplet served week-old code the whole time: the two ticks,
  # Credits at 85/15, the admin finance API and the profile experience list
  # were all merged, all green on their own PRs, and none of them were in
  # production. It surfaced as "property company should not exist" on a save,
  # which reads like a frontend bug and is not one.
  #
  # A red badge on a page nobody opens is the same as no CI at all. So a
  # failure now opens an ISSUE and assigns it, which is the one GitHub event
  # that reliably reaches an inbox and a phone.
  #
  # ONE ISSUE, NOT ONE PER FAILURE. It is found by a fixed marker in the body
  # and updated with a comment when it is already open, because seven separate
  # issues are as easy to scroll past as seven red badges. It closes itself on
  # the next green deploy, so an open issue always means "production is behind
  # main right now" rather than "something went wrong once".
  #
  # NO NEW SECRETS. GITHUB_TOKEN is issued to the run automatically; the only
  # cost is the `issues: write` permission below.
  # ---------------------------------------------------------------------------
  notify:
    name: Report deploy status
    needs: [decide, suite, netns, deploy]
    # `always()`, not `failure()`: this job has to run on a GREEN deploy too,
    # otherwise the issue it opened would never be closed. The branching is in
    # the step conditions, which read the results of the two jobs above.
    # A dry run is not a deploy: it reports nothing.
    if: always() && github.ref == 'refs/heads/main' && inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Open or update the deploy-failure issue
        # `deploy` is SKIPPED when a test job fails, so a skipped deploy is not
        # itself a failure and must not be treated as one. Checking the
        # results explicitly is what makes "the decision went red", "a test went
        # red" and "the droplet went red" all land here, and a cancelled run land
        # nowhere.
        if: needs.decide.result == 'failure' || needs.suite.result == 'failure' || needs.netns.result == 'failure' || needs.deploy.result == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- deploy-failure-tracker -->';
            const failed = [
              ['Deciding whether to test', '${{ needs.decide.result }}'],
              ['Test suite', '${{ needs.suite.result }}'],
              ['Test netns', '${{ needs.netns.result }}'],
              ['Deploy to droplet', '${{ needs.deploy.result }}'],
            ].filter(([, r]) => r === 'failure').map(([n]) => n).join(' and ');

            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha.slice(0, 8);
            const line = `**${failed}** failed for \`${sha}\`. [Run log](${run})`;

            // Search this repo's OPEN issues for the marker. `listForRepo` is
            // used rather than the search API because search is eventually
            // consistent: two failures minutes apart could both miss an issue
            // that already exists and open a second one.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = open.find((i) => (i.body || '').includes(MARKER));

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing. ${line}`,
              });
              core.setFailed(`Deploy still failing — see issue #${existing.number}`);
              return;
            }

            const body = [
              MARKER,
              '',
              '## Production is behind `main`',
              '',
              line,
              '',
              'Until this is fixed the droplet keeps serving the last commit that',
              'deployed successfully, so anything merged after it is NOT live, however',
              'green its own pull request was.',
              '',
              'This issue updates itself while the failure persists and closes itself',
              'on the next green deploy. An open copy means production is behind right',
              'now.',
            ].join('\n');

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Deploy to production is failing',
              body,
              // Assigned, because assignment is what actually generates a
              // notification. An unassigned issue in a repo you own is just
              // another row nobody reads.
              assignees: [context.repo.owner],
            });
            core.setFailed(`Deploy failing — opened issue #${created.data.number}`);

      - name: Close the failure issue on a green deploy
        # deploy only succeeds after the tests passed or were skipped by the decision.
        if: needs.decide.result == 'success' && needs.deploy.result == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- deploy-failure-tracker -->';
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = open.find((i) => (i.body || '').includes(MARKER));
            if (!existing) return;

            const sha = context.sha.slice(0, 8);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: `Deploy is green again on \`${sha}\`. Production is up to date with \`main\`.`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              state: 'closed',
              state_reason: 'completed',
            });
